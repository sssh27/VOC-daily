name: vocab_srs_app
description: A vocabulary flashcard app with spaced repetition and AI-generated content.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.2.1
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/decks/starter_deck.json
    - assets/decks/cruise_travel.json
    - assets/decks/kitchen_food.json
    - assets/decks/home_cleaning.json
    - assets/decks/clothing_shopping.json
    - assets/decks/transport_directions.json
    - assets/decks/health_symptoms.json
    # 銀色金屬珍珠(首頁背景裝飾)。1x/2x/3x 由 Flutter 依螢幕密度自動挑選,
    # 只需宣告 1x 路徑,2.0x/ 與 3.0x/ 子資料夾會被自動解析。
    - assets/images/pearl.png
